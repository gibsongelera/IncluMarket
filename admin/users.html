<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Governance &mdash; InkluMarket Admin</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/shopee.css" />
</head>
<body class="page page--admin">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header site-header--admin" role="banner">
    <div class="container header-row">
      <a class="brand" href="users.html"><span class="brand-mark" aria-hidden="true">IM</span><span class="brand-word">InkluMarket <small>Admin</small></span></a>
      <nav class="header-nav" aria-label="Primary">
        <a class="nav-link nav-link--active" href="users.html">Users</a>
        <a class="nav-link" href="products.html">Products</a>
        <a class="nav-link" href="tickets.html">Tickets</a>
        <a class="nav-link" href="compliance.html">Compliance</a>
        <a class="nav-link" href="theme.html">Theme</a>
        <button type="button" class="btn btn--ghost" data-action="toggle-contrast" aria-pressed="false">Contrast</button>
        <button type="button" class="btn btn--ghost" data-action="logout">Sign out</button>
      </nav>
    </div>
    <div class="user-strip" id="user-strip" aria-live="polite"></div>
  </header>

  <main id="main" class="container main--admin">
    <div class="page-head">
      <h1>User governance</h1>
      <div class="page-head__actions">
        <button type="button" class="btn btn--primary" id="add-user">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          Add new user
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <label for="usr-role">Role</label>
      <select id="usr-role">
        <option value="">All roles</option>
        <option value="buyer">Buyer</option>
        <option value="seller">Seller</option>
        <option value="admin">Admin</option>
      </select>
      <label for="usr-search" class="sr-only">Search</label>
      <input id="usr-search" type="search" placeholder="Search by name or email" />
      <span class="filter-bar__count muted small" id="usr-count" aria-live="polite"></span>
    </div>

    <div class="table-wrap">
      <table class="data-table" aria-label="Registered users">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Email (masked)</th>
            <th scope="col">Role</th>
            <th scope="col">Disability type</th>
            <th scope="col">Joined</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="user-rows"></tbody>
      </table>
    </div>
    <p id="users-empty" class="empty" hidden>No users match.</p>
  </main>

  <dialog id="user-modal" class="modal modal--wide" aria-labelledby="um-title">
    <form method="dialog" class="modal-form" id="user-form" novalidate>
      <h2 id="um-title">User</h2>
      <input type="hidden" name="id" />
      <div class="row">
        <div class="field">
          <label for="um-name">Full name <span aria-hidden="true" class="req">*</span></label>
          <input id="um-name" name="name" required maxlength="120" autocomplete="name" />
        </div>
        <div class="field">
          <label for="um-email">Email <span aria-hidden="true" class="req">*</span></label>
          <input id="um-email" name="email" type="email" required autocomplete="email" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="um-role">Role <span aria-hidden="true" class="req">*</span></label>
          <select id="um-role" name="role" required>
            <option value="buyer">Buyer</option>
            <option value="seller">PWD Seller</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="field" id="um-password-field">
          <label for="um-password">Password <span aria-hidden="true" class="req">*</span></label>
          <input id="um-password" name="password" type="password" minlength="8" autocomplete="new-password" />
          <small class="hint">Min 8 chars. Simulated bcrypt cost 12 hashing on save.</small>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="um-disability">Disability type</label>
          <input id="um-disability" name="disability_type" list="disability-options" maxlength="120" />
          <datalist id="disability-options">
            <option value="Visual impairment"></option>
            <option value="Low vision"></option>
            <option value="Hearing impairment"></option>
            <option value="Speech impairment"></option>
            <option value="Mobility impairment"></option>
            <option value="Physical (upper limb)"></option>
            <option value="Cognitive"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="um-needs">Assistive needs</label>
          <input id="um-needs" name="assistive_needs" maxlength="200" placeholder="e.g. screen reader, high-contrast UI" />
        </div>
      </div>

      <div class="field" id="um-consent-field">
        <label>
          <input type="checkbox" id="um-consent" />
          I confirm this user has consented to data processing under RA 10173 (Data Privacy Act) for InkluMarket demo purposes.
        </label>
      </div>

      <p id="um-error" class="form-error" role="alert" hidden></p>

      <div class="form-actions">
        <button value="cancel" class="btn btn--ghost">Cancel</button>
        <button value="submit" class="btn btn--primary" id="um-save">Save user</button>
      </div>
    </form>
  </dialog>

  <dialog id="user-details" class="modal" aria-labelledby="ud-title">
    <div class="modal-form">
      <h2 id="ud-title">User details</h2>
      <div id="ud-body"></div>
      <div class="form-actions">
        <button type="button" class="btn btn--primary" data-close-details>Close</button>
      </div>
    </div>
  </dialog>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-row"><p>&copy; 2026 InkluMarket Demo</p></div>
  </footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/page.admin-users.js"></script>
</body>
</html>
