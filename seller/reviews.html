<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reviews &mdash; InkluMarket Seller</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/shopee.css" />
</head>
<body class="page page--seller">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header site-header--seller" role="banner">
    <div class="container header-row">
      <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">IM</span><span class="brand-word">InkluMarket <small>Seller</small></span></a>
      <nav class="header-nav" aria-label="Primary">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="products.html">Products</a>
        <a class="nav-link" href="orders.html">Orders</a>
        <a class="nav-link nav-link--active" href="reviews.html">Reviews</a>
        <button type="button" class="btn btn--ghost" data-action="toggle-contrast" aria-pressed="false">Contrast</button>
        <button type="button" class="btn btn--ghost" data-action="logout">Sign out</button>
      </nav>
    </div>
    <div class="user-strip" id="user-strip" aria-live="polite"></div>
  </header>

  <main id="main" class="container main--seller">
    <h1>Customer reviews</h1>

    <section class="kpis" aria-label="Review metrics">
      <article class="kpi"><span class="kpi__label">Average rating</span><strong class="kpi__value" id="rv-avg">0.0</strong></article>
      <article class="kpi"><span class="kpi__label">Total reviews</span><strong class="kpi__value" id="rv-count">0</strong></article>
      <article class="kpi"><span class="kpi__label">5-star share</span><strong class="kpi__value" id="rv-five">0%</strong></article>
    </section>

    <div class="filter-bar">
      <label for="rv-product">Product</label>
      <select id="rv-product"><option value="">All products</option></select>
      <label for="rv-min">Min rating</label>
      <select id="rv-min">
        <option value="0">Any</option>
        <option value="1">1+</option>
        <option value="2">2+</option>
        <option value="3">3+</option>
        <option value="4">4+</option>
        <option value="5">5</option>
      </select>
    </div>

    <div id="review-feed"></div>
    <p id="reviews-empty" class="empty" hidden>No reviews match this filter.</p>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-row"><p>&copy; 2026 InkluMarket Demo</p></div>
  </footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/page.seller-reviews.js"></script>
</body>
</html>
