<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Dashboard &mdash; InkluMarket</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/shopee.css" />
</head>
<body class="page page--seller">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header site-header--seller" role="banner">
    <div class="container header-row">
      <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">IM</span><span class="brand-word">InkluMarket <small>Seller</small></span></a>
      <nav class="header-nav" aria-label="Primary">
        <a class="nav-link nav-link--active" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="products.html">Products</a>
        <a class="nav-link" href="orders.html">Orders</a>
        <a class="nav-link" href="reviews.html">Reviews</a>
        <button type="button" class="btn btn--ghost" data-action="toggle-contrast" aria-pressed="false">Contrast</button>
        <button type="button" class="btn btn--ghost" data-action="logout">Sign out</button>
      </nav>
    </div>
    <div class="user-strip" id="user-strip" aria-live="polite"></div>
  </header>

  <main id="main" class="container main--seller">
    <h1>Merchant dashboard</h1>

    <section class="kpis" aria-label="Key metrics">
      <article class="kpi"><span class="kpi__label">Monthly revenue</span><strong class="kpi__value" id="kpi-revenue">&#8369;0</strong></article>
      <article class="kpi"><span class="kpi__label">Orders (30d)</span><strong class="kpi__value" id="kpi-orders">0</strong></article>
      <article class="kpi"><span class="kpi__label">Items sold (30d)</span><strong class="kpi__value" id="kpi-items">0</strong></article>
      <article class="kpi"><span class="kpi__label">Low-stock variants</span><strong class="kpi__value" id="kpi-lowstock">0</strong></article>
    </section>

    <section class="chart-grid">
      <article class="chart-card">
        <h2>Sales volume (last 12 weeks)</h2>
        <canvas id="chart-sales" width="600" height="240" aria-label="Weekly sales volume chart" role="img"></canvas>
      </article>
      <article class="chart-card">
        <h2>Inventory turnover by product</h2>
        <canvas id="chart-turnover" width="600" height="240" aria-label="Inventory turnover chart" role="img"></canvas>
      </article>
    </section>

    <section class="recent">
      <h2>Recent orders</h2>
      <div id="recent-orders"></div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-row"><p>&copy; 2026 InkluMarket Demo</p></div>
  </footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/page.seller-dashboard.js"></script>
</body>
</html>
