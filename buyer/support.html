<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Support &mdash; InkluMarket</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/shopee.css" />
</head>
<body class="page page--buyer">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container header-row">
      <a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true">IM</span><span class="brand-word">InkluMarket</span></a>
      <nav class="header-nav" aria-label="Primary">
        <a class="nav-link" href="home.html">Shop</a>
        <a class="nav-link" href="orders.html">My Orders</a>
        <a class="nav-link nav-link--active" href="support.html">Support</a>
        <a class="nav-link nav-link--cart" href="cart.html">Cart <span class="badge badge--yellow" id="cart-count">0</span></a>
        <button type="button" class="btn btn--ghost" data-action="toggle-contrast" aria-pressed="false">Contrast</button>
        <button type="button" class="btn btn--ghost" data-action="logout">Sign out</button>
      </nav>
    </div>
    <div class="user-strip" id="user-strip" aria-live="polite"></div>
  </header>

  <main id="main" class="container main--support">
    <h1>Help &amp; support</h1>
    <div class="support-grid">
      <section aria-labelledby="new-ticket-title">
        <h2 id="new-ticket-title">Open a new ticket</h2>
        <form id="ticket-form" class="form" novalidate>
          <div class="field">
            <label for="tk-subject">Subject</label>
            <input id="tk-subject" name="subject" required maxlength="120" />
          </div>
          <div class="field">
            <label for="tk-priority">Priority</label>
            <select id="tk-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="tk-desc">Describe the issue</label>
            <textarea id="tk-desc" name="description" rows="5" required></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary">Submit ticket</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="my-tickets-title">
        <h2 id="my-tickets-title">My tickets</h2>
        <div id="my-tickets"></div>
        <p id="tickets-empty" class="empty" hidden>You have no tickets yet.</p>
      </section>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-row"><p>&copy; 2026 InkluMarket Demo</p></div>
  </footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/page.support.js"></script>
</body>
</html>
