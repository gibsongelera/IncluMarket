<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop &mdash; InkluMarket</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/shopee.css" />
</head>
<body class="page page--buyer">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container header-row">
      <a class="brand" href="home.html" aria-label="InkluMarket home">
        <span class="brand-mark" aria-hidden="true">IM</span>
        <span class="brand-word">InkluMarket</span>
      </a>
      <form class="search" role="search" id="search-form">
        <label for="search-input" class="sr-only">Search products</label>
        <input id="search-input" name="q" type="search" placeholder="Search PWD-made products&hellip;" autocomplete="off" />
        <button type="submit" class="btn btn--primary" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Search</span>
        </button>
      </form>
      <nav class="header-nav" aria-label="Primary">
        <a class="nav-link" href="home.html">Shop</a>
        <a class="nav-link" href="orders.html">My Orders</a>
        <a class="nav-link" href="support.html">Support</a>
        <a class="nav-link nav-link--cart" href="cart.html" aria-label="Cart">
          Cart <span class="badge badge--yellow" id="cart-count">0</span>
        </a>
        <button type="button" class="btn btn--ghost" data-action="toggle-contrast" aria-pressed="false">Contrast</button>
        <button type="button" class="btn btn--ghost" data-action="logout">Sign out</button>
      </nav>
    </div>
    <div class="user-strip" id="user-strip" aria-live="polite"></div>
  </header>

  <main id="main" class="container main--buyer">
    <aside class="filters" aria-labelledby="filters-title">
      <h2 id="filters-title">Filters</h2>
      <div class="field">
        <label for="filter-category">Category</label>
        <select id="filter-category">
          <option value="">All categories</option>
        </select>
      </div>
      <fieldset class="field">
        <legend>Price range (PHP)</legend>
        <div class="row">
          <input type="number" min="0" id="filter-min" placeholder="Min" aria-label="Minimum price" />
          <input type="number" min="0" id="filter-max" placeholder="Max" aria-label="Maximum price" />
        </div>
      </fieldset>
      <fieldset class="field">
        <legend>Minimum rating</legend>
        <div class="row rating-row" id="filter-rating">
          <label><input type="radio" name="rating" value="0" checked /> Any</label>
          <label><input type="radio" name="rating" value="3" /> 3+</label>
          <label><input type="radio" name="rating" value="4" /> 4+</label>
          <label><input type="radio" name="rating" value="5" /> 5</label>
        </div>
      </fieldset>
      <div class="form-actions">
        <button type="button" class="btn btn--primary" id="apply-filters">Apply</button>
        <button type="button" class="btn btn--ghost" id="clear-filters">Clear</button>
      </div>
    </aside>

    <section class="feed" aria-labelledby="feed-title">
      <section class="category-strip" aria-labelledby="cats-title">
        <h2 id="cats-title">Shop by category</h2>
        <div class="category-chips" id="category-chips" role="group" aria-label="Categories"></div>
      </section>

      <div class="feed-head">
        <h1 id="feed-title">Discover</h1>
        <p class="muted" id="result-count"></p>
      </div>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
      <p id="empty-state" class="empty" hidden>No products match your filters.</p>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-row">
      <p>&copy; 2026 InkluMarket Demo</p>
    </div>
  </footer>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/page.buyer-home.js"></script>
</body>
</html>
