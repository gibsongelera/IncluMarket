<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Orders &mdash; InkluMarket</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/shopee.css" />
</head>
<body class="page page--buyer">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container header-row">
      <a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true">IM</span><span class="brand-word">InkluMarket</span></a>
      <nav class="header-nav" aria-label="Primary">
        <a class="nav-link" href="home.html">Shop</a>
        <a class="nav-link nav-link--active" href="orders.html">My Orders</a>
        <a class="nav-link" href="support.html">Support</a>
        <a class="nav-link nav-link--cart" href="cart.html">Cart <span class="badge badge--yellow" id="cart-count">0</span></a>
        <button type="button" class="btn btn--ghost" data-action="toggle-contrast" aria-pressed="false">Contrast</button>
        <button type="button" class="btn btn--ghost" data-action="logout">Sign out</button>
      </nav>
    </div>
    <div class="user-strip" id="user-strip" aria-live="polite"></div>
  </header>

  <main id="main" class="container main--orders">
    <h1>My orders</h1>
    <div class="tabs" role="tablist" id="order-tabs" aria-label="Order status">
      <button role="tab" class="tab tab--active" data-status="all" aria-selected="true">All</button>
      <button role="tab" class="tab" data-status="pending" aria-selected="false">Pending</button>
      <button role="tab" class="tab" data-status="processing" aria-selected="false">Processing</button>
      <button role="tab" class="tab" data-status="shipped" aria-selected="false">Shipped</button>
      <button role="tab" class="tab" data-status="delivered" aria-selected="false">Delivered</button>
      <button role="tab" class="tab" data-status="returned" aria-selected="false">Returned</button>
    </div>
    <div id="orders-list"></div>
    <p id="orders-empty" class="empty" hidden>No orders yet.</p>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-row"><p>&copy; 2026 InkluMarket Demo</p></div>
  </footer>

  <dialog id="review-modal" class="modal" aria-labelledby="review-modal-title">
    <form method="dialog" class="modal-form" id="review-form">
      <h2 id="review-modal-title">Leave a review</h2>
      <input type="hidden" name="product_id" />
      <input type="hidden" name="order_id" />
      <div class="field">
        <label for="review-rating">Rating</label>
        <div class="star-input" id="review-rating" role="radiogroup" aria-label="Rating from 1 to 5"></div>
      </div>
      <div class="field">
        <label for="review-comment">Comment</label>
        <textarea id="review-comment" name="comment" rows="4" required></textarea>
      </div>
      <div class="form-actions">
        <button value="cancel" class="btn btn--ghost">Cancel</button>
        <button value="submit" class="btn btn--primary" id="review-submit">Submit review</button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/page.buyer-orders.js"></script>
</body>
</html>
