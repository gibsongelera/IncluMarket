<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout &mdash; InkluMarket</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/shopee.css" />
</head>
<body class="page page--buyer">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container header-row">
      <a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true">IM</span><span class="brand-word">InkluMarket</span></a>
      <nav class="header-nav" aria-label="Primary">
        <a class="nav-link" href="home.html">Shop</a>
        <a class="nav-link" href="orders.html">My Orders</a>
        <a class="nav-link" href="support.html">Support</a>
        <a class="nav-link nav-link--cart" href="cart.html">Cart <span class="badge badge--yellow" id="cart-count">0</span></a>
        <button type="button" class="btn btn--ghost" data-action="toggle-contrast" aria-pressed="false">Contrast</button>
        <button type="button" class="btn btn--ghost" data-action="logout">Sign out</button>
      </nav>
    </div>
    <div class="user-strip" id="user-strip" aria-live="polite"></div>
  </header>

  <main id="main" class="container main--checkout">
    <h1>Checkout</h1>
    <div class="checkout-grid">
      <form id="checkout-form" class="checkout-form" novalidate>
        <fieldset>
          <legend>Delivery details</legend>
          <div class="field">
            <label for="ck-name">Full name</label>
            <input id="ck-name" name="name" required />
          </div>
          <div class="field">
            <label for="ck-address">Delivery address</label>
            <textarea id="ck-address" name="address" rows="3" required></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label for="ck-city">City</label>
              <input id="ck-city" name="city" required />
            </div>
            <div class="field">
              <label for="ck-phone">Contact number</label>
              <input id="ck-phone" name="phone" inputmode="tel" required />
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Payment (demo)</legend>
          <div class="field">
            <label><input type="radio" name="payment" value="cod" checked /> Cash on delivery</label>
          </div>
          <div class="field">
            <label><input type="radio" name="payment" value="ewallet" /> E-wallet (simulated)</label>
          </div>
          <p class="hint">No real payment is processed. This is a capstone demo.</p>
        </fieldset>

        <div class="form-actions">
          <a href="cart.html" class="btn btn--ghost">Back to cart</a>
          <button type="submit" class="btn btn--primary">Place order</button>
        </div>
      </form>

      <aside class="checkout-summary" aria-labelledby="sum-title">
        <h2 id="sum-title">Order summary</h2>
        <div id="checkout-items"></div>
        <dl class="totals">
          <div><dt>Subtotal</dt><dd id="ck-subtotal">&#8369;0.00</dd></div>
          <div><dt>Shipping</dt><dd id="ck-shipping">&#8369;0.00</dd></div>
          <div class="grand"><dt>Total</dt><dd id="ck-total">&#8369;0.00</dd></div>
        </dl>
      </aside>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-row"><p>&copy; 2026 InkluMarket Demo</p></div>
  </footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/page.checkout.js"></script>
</body>
</html>
